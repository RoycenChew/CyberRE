# Confidence weights.
#
# Every number CyberRE attaches to a finding comes from here and from the
# evidence. A model never emits one (ADR-009).
#
# These weights were measured at M14 and LEFT UNCHANGED, deliberately.
#
# The benchmark (ADR-025) found a weight set scoring +0.03 higher that held
# up on the holdout split. It was rejected. Detection was identical - F1 1.0
# either way - and the entire gain came from raising every positive from
# 0.885 to 0.954, which improves the calibration term only because no case
# in the corpus is flagged incorrectly. That is a property of the corpus,
# not a better scorer, and the tuner now refuses such results itself.
#
# What the benchmark did establish is a regression floor: run
# `cyberre benchmark` and a change that makes detection worse fails.
#
# Retune when the corpus contains positives that *should* score low - a flow
# behind a weak sanitiser, a finding resting on one tool. Bump the version
# when the weights change, so a finding scored under v1 can be re-examined.

version = "v1"

[weights]
# How much of the requirement set was established. The dominant term,
# because a finding missing half its requirements is half a finding
# whatever else is true.
evidence_completeness = 0.30

# Distinct underlying observations behind the satisfied requirements. One
# analysis establishing four facts is weaker than four analyses agreeing,
# and the formula should say so.
evidence_independence = 0.20

# Reliability of the producing tools, from the capability registry. A
# property of the tool, measured against the benchmark - never a per-run
# judgement.
tool_reliability = 0.15

# Independent sources agreeing. Saturates quickly: the third corroborating
# source adds much less than the second.
source_corroboration = 0.10

# Whether a path from an entry point was established. Weighted heavily for
# its size because unreachable code is the most common reason a true-looking
# finding is not one.
reachability_established = 0.15

# Complete provenance, and real-tool rather than fixture evidence.
provenance_quality = 0.10

[thresholds]
# Below this, a finding is held for human review rather than reported. Set
# conservatively: a low-confidence finding that reaches a report costs an
# analyst more time than one that is withheld.
needs_review_below = 0.45

# Contradicting evidence subtracts this much per contradiction, to a floor.
contradiction_penalty = 0.25
contradiction_floor = 0.1

# Corroboration saturation: the number of independent sources at which the
# corroboration factor reaches 1.0.
corroboration_saturation = 3
