name: Real tool tier

# Fixtures prove our parsers. Only this workflow proves that the real external
# tools behave as the adapters assume. A release may not claim production
# readiness until this tier passes (ADR-004).
#
# It is expected to report skips until GHIDRA_INSTALL_DIR is provisioned. The
# skip reasons say so explicitly, because a silently skipped tier is
# indistinguishable from a passing one in a CI summary.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      ghidra_version:
        description: Ghidra version to install
        default: "11.1.2"

permissions:
  contents: read

jobs:
  ghidra:
    name: Ghidra (live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Ghidra
        id: ghidra
        continue-on-error: true
        env:
          VERSION: ${{ github.event.inputs.ghidra_version || '12.1.2' }}
        run: |
          set -euo pipefail
          # Resolve the asset through the release API rather than guessing a
          # filename: the published name embeds a build date, so a hardcoded
          # URL breaks on every release.
          api="https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/tags/Ghidra_${VERSION}_build"
          url=$(curl -fsSL "$api" | python -c "import json,sys; print(next(a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if a['name'].endswith('.zip')))")
          curl -fsSL -o ghidra.zip "$url"
          unzip -q ghidra.zip -d "$HOME/ghidra"
          # The extracted directory name also embeds the build date, so the
          # install root is discovered rather than assumed.
          props=$(find "$HOME/ghidra" -maxdepth 4 -path "*/Ghidra/application.properties" | head -1)
          echo "GHIDRA_INSTALL_DIR=$(dirname "$(dirname "$props")")" >> "$GITHUB_ENV"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Semgrep
        continue-on-error: true
        run: pip install semgrep

      # No Jython extension and no PyGhidra: the export script is Java and
      # runs in Ghidra's own JVM (ADR-023).

      - name: Real tool tests
        run: pytest -m realtool -rs

      - name: Report whether the tier actually ran
        if: always()
        run: |
          if [ -z "${GHIDRA_INSTALL_DIR:-}" ]; then
            echo "::warning::Ghidra was not installed; the Ghidra integration is UNVERIFIED."
          else
            echo "Ghidra integration exercised against $GHIDRA_INSTALL_DIR"
          fi
