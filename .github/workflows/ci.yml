name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Types
        run: mypy

      # The architecture gate runs as its own step so a boundary violation is
      # reported distinctly from an ordinary test failure.
      - name: Architecture boundaries
        run: pytest -m architecture

      - name: Tests
        # The realtool tier needs Ghidra / Semgrep / Docker installed and is
        # exercised by the realtool workflow, not here. Fixture tests prove
        # parsing; they never stand in for real-tool behaviour (ADR-004).
        run: pytest -m "not realtool" --cov --cov-report=term-missing
