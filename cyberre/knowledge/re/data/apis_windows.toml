# Windows API semantics.
#
# Each entry says what a call is useful for and - where there is one - the
# innocent reading. Most uses of most of these are legitimate. A knowledge
# base that omits the benign explanation trains the system toward false
# positives, so `benign_explanation` is not optional politeness.
#
# `companions` is the mechanism that stops a single scary import becoming a
# finding: validation looks for the sequence, not the symbol.

domain = "apis"

[[record]]
id = "win.api.OpenProcess"
version = 1
statement = "Obtains a handle to another process, with requested access rights."
source_ref = "Microsoft Learn, processthreadsapi.h, OpenProcess"
confidence = 0.95
category = "process"
danger_class = "injection_primitive"
companions = ["VirtualAllocEx", "WriteProcessMemory", "CreateRemoteThread"]
attack = ["T1055"]
benign_explanation = "Debuggers, profilers, task managers and crash reporters all open process handles."
applicability = { os = ["windows"] }

